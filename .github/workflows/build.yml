name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK by version
        run: |
          V=$(grep "def vName" app/build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/GoldIslands-$V.apk"
          echo "VER=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: GoldIslands-${{ env.VER }}
          path: out/*.apk
