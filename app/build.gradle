plugins { id 'com.android.application' }

// גרסה: מתחילה ב-1.0.0 ועולה באחד בכל עדכון (כל ספרה מתגלגלת ב-10)
def vName = '1.0.8'
def p = vName.tokenize('.')
def vCode = p[0].toInteger() * 100 + p[1].toInteger() * 10 + p[2].toInteger()

android {
    namespace 'com.betzalel.goldislands'
    compileSdk 34
    defaultConfig {
        applicationId 'com.betzalel.goldislands'
        minSdk 21
        targetSdk 34
        versionCode vCode
        versionName vName
    }
    // אותו מפתח חתימה תמיד, כדי שכל גרסה תותקן כעדכון על הקודמת
    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'goldislands2026'
            keyAlias 'goldislands'
            keyPassword 'goldislands2026'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { signingConfig signingConfigs.release }
    }
    sourceSets { main { assets.srcDirs = ['../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
